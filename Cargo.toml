# SPDX-License-Identifier: MIT
[package]
name = "supergrafx-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust NEC SuperGrafx transcribed from, and proven equivalent to, supergrafx-python: an add-on to pcengine-rust through its socket traits"
license = "MIT"
repository = "https://github.com/alewman/supergrafx-rust"
readme = "README.md"
publish = false

[lib]
name = "supergrafx_rust"

[dependencies]
# The base board, pcengine-rust at 8f672f0 by git revision: the clean rewrite of 2026-11-19 and
# the crop of a display that starts before the row (37f17ba, transcribed from pcengine-python
# 03ac699, the revision supergrafx-python 8347704 pins), plus its own git pin of the CPU core,
# huc6280-rust e1d24a3 (2026-11-20; 37f17ba took the core by path, which a git dependency cannot
# use). Nothing is copied from either. To build against a local checkout of the base board
# instead, without editing this file:
#   cargo build --config 'patch."https://github.com/alewman/pcengine-rust".pcengine-rust.path="../pcengine-rust"'
pcengine_rust = { package = "pcengine-rust", git = "https://github.com/alewman/pcengine-rust", rev = "8f672f00818bf4ccb7aa90ca2916a00f47ba92d6" }
# The VPC's part of a save state (sockets::DeviceState) and the known cards' SHA-1.
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha1 = "0.10"

[profile.release]
debug = 1
